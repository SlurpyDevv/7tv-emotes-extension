<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChannelEmotes - Panel</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="extension-container">
      <div class="header">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" class="header-logo">
          <text font-family="'Inter','Segoe UI',sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
            <tspan x="0" y="27" fill="white">Channel</tspan><tspan fill="#9b59ff">Emotes</tspan>
          </text>
        </svg>
        <span class="emote-count"></span>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="7tv">7TV</button>
        <button class="tab" data-tab="twitch">Twitch</button>
        <button class="tab" data-tab="global">Global</button>
      </div>
      <div class="controls-bar">
        <input type="text" class="search-input" placeholder="Search emotes..." />
        <div class="controls-row">
          <select class="sort-select">
            <option value="default">Order added</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="newest">Newest first</option>
          </select>
          <button class="anim-toggle" data-active="false">Animated</button>
        </div>
      </div>
      <div class="emotes"></div>
    </div>
  </body>
</html>
